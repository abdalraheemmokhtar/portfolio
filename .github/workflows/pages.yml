# GitHub Pages for this repo publishes the gh-pages branch, not master.
# This job copies the static site onto gh-pages after each push to master.
# There is no build. If the job cannot update gh-pages, point Pages at
# master / (root) instead. The public URL does not change.
name: Publish site

on:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: publish-site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish repository root to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dest="$(mktemp -d)"
          cp -a "${GITHUB_WORKSPACE}/." "${dest}/"
          rm -rf "${dest}/.git"
          cd "${dest}"
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish portfolio site"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="AUTHORIZATION: bearer ${GITHUB_TOKEN}" push --force origin gh-pages
